<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1affairs Pipeline Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-6 max-w-6xl">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Instagram Carousel Pipeline</h1>
            <p class="text-gray-400 mt-2">Generate 3:4 Viral News Carousels</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Controls Sidebar -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg h-fit">
                <h2 class="text-xl font-semibold mb-4 border-b border-gray-600 pb-2">Configuration</h2>
                
                <form id="pipelineForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Channel Name</label>
                        <input type="text" id="channelName" value="1affairs" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300">Category (if Auto)</label>
                        <select id="category" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="finance">Finance</option>
                            <option value="news">General News</option>
                            <option value="tech">Tech</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-gray-300">Number of Slides</label>
                            <span id="slideCountVal" class="text-xs font-semibold text-blue-400 bg-gray-700 px-2 py-0.5 rounded">3 Slides</span>
                        </div>
                        <input type="range" id="slideCount" min="3" max="8" value="3" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300">Topic Selection</label>
                        <div class="mt-2 space-y-2">
                            <label class="flex items-center">
                                <input type="radio" name="topicMode" value="auto" checked class="text-blue-500 bg-gray-700 border-gray-600 focus:ring-blue-500">
                                <span class="ml-2 text-sm text-gray-300">Auto (Trending)</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="topicMode" value="custom" class="text-blue-500 bg-gray-700 border-gray-600 focus:ring-blue-500">
                                <span class="ml-2 text-sm text-gray-300">Custom Topic</span>
                            </label>
                        </div>
                    </div>

                    <div id="customTopicContainer" class="hidden">
                        <label class="block text-sm font-medium text-gray-300">Custom Headline / Link</label>
                        <textarea id="customTopic" rows="3" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Mukesh Ambani launches new AI initiative..."></textarea>
                    </div>

                    <button type="submit" id="runBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 mt-4">
                        Generate Carousel
                    </button>
                </form>
            </div>

            <!-- Main Content Area -->
            <div class="md:col-span-2 space-y-6">
                <!-- Terminal Output -->
                <div class="bg-gray-950 rounded-lg shadow-lg border border-gray-700 overflow-hidden flex flex-col h-64">
                    <div class="bg-gray-800 px-4 py-2 border-b border-gray-700 flex justify-between items-center">
                        <span class="text-xs font-mono text-gray-400">pipeline.log</span>
                        <div class="flex space-x-2">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                    </div>
                    <div id="terminal" class="terminal p-4 text-sm text-green-400 overflow-y-auto flex-1">
                        System ready. Waiting for task...
                    </div>
                </div>

                <!-- Results Area -->
                <div id="resultsArea" class="hidden bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-4 border-b border-gray-600 pb-2">Generated Results</h2>
                    
                    <div class="mb-4">
                        <h3 class="text-sm font-medium text-gray-400 mb-2">Generated Caption:</h3>
                        <div id="captionBox" class="bg-gray-700 p-3 rounded text-sm text-gray-200 whitespace-pre-wrap"></div>
                    </div>

                    <h3 class="text-sm font-medium text-gray-400 mb-2">Slides:</h3>
                    <div id="slidesGallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Slides will be injected here -->
                    </div>
                    
                    <div class="mt-6 flex justify-end">
                        <button onclick="downloadAll()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition duration-200 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download All Images
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('pipelineForm');
        const runBtn = document.getElementById('runBtn');
        const terminal = document.getElementById('terminal');
        const resultsArea = document.getElementById('resultsArea');
        const slidesGallery = document.getElementById('slidesGallery');
        const captionBox = document.getElementById('captionBox');
        
        const topicModeRadios = document.getElementsByName('topicMode');
        const customTopicContainer = document.getElementById('customTopicContainer');

        let generatedSlides = [];

        // Toggle custom topic text area
        topicModeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    customTopicContainer.classList.remove('hidden');
                } else {
                    customTopicContainer.classList.add('hidden');
                }
            });
        });

        const slideCountSlider = document.getElementById('slideCount');
        const slideCountVal = document.getElementById('slideCountVal');
        slideCountSlider.addEventListener('input', (e) => {
            slideCountVal.textContent = `${e.target.value} Slides`;
        });

        function logToTerminal(msg, color = 'text-green-400') {
            const div = document.createElement('div');
            div.className = color;
            div.textContent = `> ${msg}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Reset
            terminal.innerHTML = '';
            resultsArea.classList.add('hidden');
            slidesGallery.innerHTML = '';
            generatedSlides = [];
            runBtn.disabled = true;
            runBtn.textContent = 'Running...';
            runBtn.classList.replace('bg-blue-600', 'bg-gray-600');

            const payload = {
                channelName: document.getElementById('channelName').value,
                slideCount: parseInt(document.getElementById('slideCount').value) || 3,
                category: document.getElementById('category').value,
                topicMode: document.querySelector('input[name="topicMode"]:checked').value,
                customTopic: document.getElementById('customTopic').value,
            };

            logToTerminal(`Initializing pipeline (${payload.slideCount} slides)...`, 'text-blue-400');

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const { jobId } = await res.json();
                
                // Connect SSE
                const eventSource = new EventSource(`/api/stream/${jobId}`);
                
                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'log') {
                        logToTerminal(data.message);
                    } else if (data.type === 'error') {
                        logToTerminal(`ERROR: ${data.message}`, 'text-red-500');
                        eventSource.close();
                        resetBtn();
                    } else if (data.type === 'done') {
                        logToTerminal('Pipeline finished successfully!', 'text-blue-400');
                        eventSource.close();
                        showResults(data.data);
                        resetBtn();
                    }
                };
                
                eventSource.onerror = () => {
                    logToTerminal('Lost connection to server.', 'text-red-500');
                    eventSource.close();
                    resetBtn();
                };

            } catch (err) {
                logToTerminal(`Request failed: ${err.message}`, 'text-red-500');
                resetBtn();
            }
        });

        function showResults(data) {
            resultsArea.classList.remove('hidden');
            captionBox.textContent = data.caption || 'No caption generated.';
            
            data.slides.forEach(slideFile => {
                const url = `/output/${slideFile}?t=${Date.now()}`;
                generatedSlides.push(url);
                
                const div = document.createElement('div');
                div.className = 'relative group border border-gray-600 rounded overflow-hidden aspect-[3/4]';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 transition duration-200 flex items-center justify-center opacity-0 group-hover:opacity-100">
                        <a href="${url}" download="${slideFile}" class="bg-gray-900 bg-opacity-80 text-white text-xs py-1 px-3 rounded hover:bg-gray-700">Download</a>
                    </div>
                `;
                slidesGallery.appendChild(div);
            });
        }

        function resetBtn() {
            runBtn.disabled = false;
            runBtn.textContent = 'Generate Carousel';
            runBtn.classList.replace('bg-gray-600', 'bg-blue-600');
        }

        async function downloadAll() {
            if (generatedSlides.length === 0) return;
            
            // Create temporary links to trigger multiple downloads
            for (let i = 0; i < generatedSlides.length; i++) {
                const link = document.createElement('a');
                link.href = generatedSlides[i];
                link.download = `slide_${i + 1}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                // Small delay to prevent browser blocking multiple downloads
                await new Promise(r => setTimeout(r, 200));
            }
        }
    </script>
</body>
</html>
